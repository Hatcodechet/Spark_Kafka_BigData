services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: electricity-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - electricity-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: electricity-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - electricity-net

  postgres:
    image: postgres:15
    container_name: electricity-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: electricity
      POSTGRES_USER: bdgrp
      POSTGRES_PASSWORD: bdgrp2026
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./storage/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - electricity-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: electricity-elasticsearch
    profiles:
      - search
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - electricity-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: electricity-kibana
    profiles:
      - search
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    networks:
      - electricity-net

volumes:
  postgres-data:

networks:
  electricity-net:
    driver: bridge
